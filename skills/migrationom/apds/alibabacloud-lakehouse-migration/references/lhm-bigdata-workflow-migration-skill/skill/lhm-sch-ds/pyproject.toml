[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lhm-sch-ds-cli"
version = "0.1.0"
description = "LHM Scheduler Datasource management CLI tool"
readme = "SKILL.md"
requires-python = ">=3.9"
dependencies = [
    "click>=8.0",
    "requests>=2.21.0",
]

[project.scripts]
lhm-sch-ds = "lhm_ds_cli.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["scripts/lhm_ds_cli"]


