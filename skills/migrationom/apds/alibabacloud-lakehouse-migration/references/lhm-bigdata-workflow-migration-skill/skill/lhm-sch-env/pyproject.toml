[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lhm-sch-env-cli"
version = "0.1.0"
description = "LHM Scheduler Migration Environment Check CLI tool"
readme = "SKILL.md"
requires-python = ">=3.9"
dependencies = [
    "click>=8.0",
]

[project.scripts]
lhm-sch-env = "lhm_sch_env.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["scripts/lhm_sch_env"]


