category: ip_geo_functions
name: IP geolocation functions
description: Convert IP addresses to geographic locations.
support:
  spl: true
functions:
- name: ip_to_province
  syntax: ip_to_province(ip)
  description: Convert an IP address to a province.
  returns: Province name in Chinese
  example: '* | extend province = ip_to_province(client_ip)'
- name: ip_to_city
  syntax: ip_to_city(ip)
  description: Convert an IP address to a city.
  returns: City name in Chinese
  example: '* | extend city = ip_to_city(client_ip)'
- name: ip_to_country
  syntax: ip_to_country(ip)
  description: Convert an IP address to a country.
  returns: Country name in Chinese
  example: '* | extend country = ip_to_country(client_ip)'
- name: ip_to_geo
  syntax: ip_to_geo(ip)
  description: Convert an IP address to geographic coordinates.
  returns: Coordinate string in latitude,longitude format
  example: '* | extend geo = ip_to_geo(client_ip)'
