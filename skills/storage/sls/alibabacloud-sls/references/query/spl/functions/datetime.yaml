category: datetime_functions
name: Date and time functions
description: Process dates and times.
support:
  spl: true
functions:
- name: date_format
  syntax: date_format(timestamp, format)
  description: Format a timestamp.
  format_examples:
  - '%Y-%m-%d': '2024-01-01'
  - '%Y-%m-%d %H:%i:%s': '2024-01-01 12:30:45'
  - '%H:%i': '12:30'
  examples:
    spl: '* | extend time_str = date_format(from_unixtime(cast(__time__ as DOUBLE)), ''%Y-%m-%d %H:%i:%s'')'
  note: __time__ is the log timestamp in Unix seconds.
- name: date_parse
  syntax: date_parse(string, format)
  description: Parse timestamp text.
  examples:
    spl: '* | extend timestamp = date_parse(time_str, ''%Y-%m-%d %H:%i:%s'')'
- name: from_unixtime
  syntax: from_unixtime(unix_timestamp)
  description: Convert a Unix timestamp to a time value.
  examples:
    spl: '* | extend time_obj = from_unixtime(cast(__time__ as DOUBLE))'
  note: Convert Unix-second fields to DOUBLE before passing them to from_unixtime.
- name: to_unixtime
  syntax: to_unixtime(timestamp)
  description: Convert a time value to a Unix timestamp.
  examples:
    spl: '* | extend unix_ts = to_unixtime(cast(time_str as TIMESTAMP))'
- name: date_trunc
  syntax: date_trunc(unit, timestamp)
  description: Truncate time to the specified unit.
  units:
  - second
  - minute
  - hour
  - day
  - week
  - month
  - quarter
  - year
  examples:
    spl: '* | extend hour = date_trunc(''hour'', from_unixtime(cast(__time__ as DOUBLE)))'
  note: Commonly used for grouping by time.
- name: date_diff
  syntax: date_diff(unit, x, y)
  description: Return the difference between two time values in the specified unit.
  reference: https://help.aliyun.com/zh/sls/date-and-time-functions-1
