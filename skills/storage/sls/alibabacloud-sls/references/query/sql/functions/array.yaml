category: array_functions
name: Array functions and operators
description: Add, remove, retrieve, traverse, and transform array elements.
functions:
- name: array_distinct
  syntax: array_distinct(x)
  description: Remove duplicate elements from an array.
  example: >-
    * | SELECT array_distinct(ARRAY[1,2,2,3]) AS result FROM log LIMIT 1
  example_output:
    result:
    - 1
    - 2
    - 3
- name: array_intersect
  syntax: array_intersect(x, y)
  description: Calculate the intersection of two arrays.
  example: >-
    * | SELECT array_intersect(ARRAY[1,2,3],ARRAY[2,3,4]) AS result FROM log LIMIT 1
  example_output:
    result:
    - 2
    - 3
- name: array_union
  syntax: array_union(x, y)
  description: Calculate the union of two arrays.
  example: >-
    * | SELECT array_union(ARRAY[1,2],ARRAY[2,3]) AS result FROM log LIMIT 1
  example_output:
    result:
    - 1
    - 2
    - 3
- name: array_except
  syntax: array_except(x, y)
  description: Calculate the difference between two arrays.
  example: >-
    * | SELECT array_except(ARRAY[1,2,3],ARRAY[2,4]) AS result FROM log LIMIT 1
  example_output:
    result:
    - 1
    - 3
- name: array_join
  syntax: array_join(x, delimiter [, null_replacement])
  description: Join array elements into a string using the specified delimiter.
  params:
  - x: Array
  - delimiter: Delimiter
  - null_replacement: Optional string used to replace NULL elements
  note: NULL elements are omitted unless null_replacement is supplied.
  example: >-
    * | SELECT array_join(ARRAY['api',NULL,'error'], ',', '(missing)') AS result FROM log LIMIT 1
  example_output:
    result: api,(missing),error
- name: array_max
  syntax: array_max(x)
  description: Return the maximum array element.
  example: >-
    * | SELECT array_max(ARRAY[3,1,2]) AS result FROM log LIMIT 1
  example_output:
    result: 3
  note: Returns NULL if the array contains a NULL element.
- name: array_min
  syntax: array_min(x)
  description: Return the minimum array element.
  example: >-
    * | SELECT array_min(ARRAY[3,1,2]) AS result FROM log LIMIT 1
  example_output:
    result: 1
  note: Returns NULL if the array contains a NULL element.
- name: array_position
  syntax: array_position(x, element)
  description: Return the 1-based index of an element, or 0 if it is absent.
  example: >-
    * | SELECT array_position(ARRAY[10,20,30],20) AS result FROM log LIMIT 1
  example_output:
    result: 2
- name: array_remove
  syntax: array_remove(x, element)
  description: Remove all occurrences of an element from an array.
  example: >-
    * | SELECT array_remove(ARRAY[1,2,2,3],2) AS result FROM log LIMIT 1
  example_output:
    result:
    - 1
    - 3
- name: array_sort
  syntax: array_sort(x)
  description: Sort array elements in ascending order, with NULL elements last.
  example: >-
    * | SELECT array_sort(ARRAY[3,NULL,1,2]) AS result FROM log LIMIT 1
  example_output:
    result:
    - 1
    - 2
    - 3
    - null
- name: cardinality
  syntax: cardinality(x)
  description: Count array elements.
  example: >-
    * | SELECT cardinality(ARRAY[1,NULL,3]) AS result FROM log LIMIT 1
  example_output:
    result: 3
- name: contains
  syntax: contains(x, element)
  description: Test whether an array contains the specified element.
  returns: boolean
  example: >-
    * | SELECT contains(ARRAY[1,2,3],2) AS result FROM log LIMIT 1
  example_output:
    result: true
  note: If no element matches and the array contains NULL, the result is NULL rather than false.
- name: reverse
  syntax: reverse(x)
  description: Reverse the order of array elements.
  example: >-
    * | SELECT reverse(ARRAY[1,2,3]) AS result FROM log LIMIT 1
  example_output:
    result:
    - 3
    - 2
    - 1
- name: slice
  syntax: slice(x, start, length)
  description: Extract a subset of an array.
  params:
  - start: Indexes start at 1; a negative start counts from the end.
  - length: Number of elements in the subset
  example: >-
    * | SELECT slice(ARRAY[10,20,30,40],-2,2) AS result FROM log LIMIT 1
  example_output:
    result:
    - 30
    - 40
- name: filter
  syntax: filter(x, lambda_expression)
  description: Filter array elements using a lambda expression.
  example: >-
    * | SELECT filter(ARRAY[5,-6,NULL,7],x -> x > 0) AS result FROM log LIMIT 1
  example_output:
    result:
    - 5
    - 7
- name: transform
  syntax: transform(x, lambda_expression)
  description: Apply a lambda expression to every array element.
  example: >-
    * | SELECT transform(ARRAY[5,NULL,6],x -> coalesce(x,0)+1) AS result FROM log LIMIT 1
  example_output:
    result:
    - 6
    - 1
    - 7
- name: reduce
  syntax: reduce(x, initial_value, combine_function, final_function)
  description: Accumulate array elements using a lambda expression.
  example: >-
    * | SELECT reduce(ARRAY[5,20,50],0,(s,x)->s+x,s->s) AS result FROM log LIMIT 1
  example_output:
    result: 75
- name: sequence
  syntax: sequence(x, y [, step])
  description: Generate an inclusive sequence, increasing or decreasing.
  params:
  - x: Starting value
  - y: Ending value
  - step: Defaults to 1 when start <= end and -1 otherwise; supply a matching step for an explicit direction.
  example: >-
    * | SELECT sequence(3,1) AS result FROM log LIMIT 1
  example_output:
    result:
    - 3
    - 2
    - 1
- name: zip
  syntax: zip(x, y...)
  description: Combine corresponding array elements into an array of rows.
  example: >-
    * | SELECT zip(ARRAY[1,2],ARRAY['a']) AS result FROM log LIMIT 1
  example_output:
    result:
    - - 1
      - a
    - - 2
      - null
  returns: array(row(...))
  note: Shorter arrays are padded with NULL; the displayed JSON is a nested array.
- name: array_agg
  syntax: array_agg(value)
  description: Collect values from multiple rows into an array within each group.
  returns: array
  note: Duplicates are retained. The example sorts the collected values with array_sort.
  example_input:
  - status: 200
  - status: 500
  - status: 200
  example: >-
    * | SELECT array_sort(array_agg(status)) AS result
  example_output:
    result:
    - 200
    - 200
    - 500
important_notes:
- Array indexes start at 1.
- Lambda expressions support complex array processing.
- Use cast and json_parse to process array fields stored as JSON.
source: https://help.aliyun.com/zh/sls/array-functions-and-operators
