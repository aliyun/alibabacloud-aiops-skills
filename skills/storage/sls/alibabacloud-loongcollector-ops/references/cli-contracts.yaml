# aliyun sls command contracts (verified against aliyun CLI 3.4.6 + plugin aliyun-cli-sls 0.7.0)
#
# status legend:
#   confirmed   : subcommand + params verified via `aliyun sls <cmd> --help`
#   cli_gap     : no direct plugin subcommand; use documented fallback
#   product_gap : no public SLS OpenAPI/CLI; use degradation path
#
# Rules for all write commands:
#   - After explicit business approval, run `--cli-dry-run` and the actual write as separate direct commands.
#   - Exception: when get/list proves the desired state already matches, skip both calls and emit the exact Idempotent-Skip record.
#   - Coupled config/index: run both dry-runs first, then both actual writes back-to-back with nothing between them.
#   - Get before Update; Update is overwrite semantics — carry unchanged fields back.
#   - Get/list before Create/Apply; an Idempotent-Skip plus verification counts as successful completion.
#   - Every cloud tool invocation contains exactly one direct, literal `aliyun sls ...` command.
#   - Every cloud-API command carries: --region <r> --user-agent "AlibabaCloud-Agent-Skills/alibabacloud-loongcollector-ops session/<session-id>"
#   - JSON list/object params passed as single-quoted JSON, e.g. --inputs '[{"Type":"input_file",...}]'
#   - list output default is JSON; parse only declared fields; use --cli-query <jmespath> to project.

meta:
  cli_min_version: "3.3.3"
  cli_verified_version: "3.4.6"
  plugin: "aliyun-cli-sls"
  plugin_verified_version: "0.7.0"
  api_version: "2020-12-30"
  dry_run_flag: "--cli-dry-run"
  global_flags: ["--region", "--endpoint", "--cli-query", "--pager/--all-pages", "-q/--quiet", "--user-agent"]
  error_recovery:
    max_retries_after_initial_attempt: 3
    parameter: "[Error: parameter] 400 ParameterInvalid -> preserve requestID, fix invalid parameter only, retry same API -> [RECOVERED: parameter_fixed]"
    throttling: "[Error: throttling] 429/WriteQuotaExceed -> preserve requestID, bounded exponential backoff, retry identical command -> [RECOVERED: throttling_retry]"
    internal: "[Error: internal] 500/InternalServerError -> preserve requestID, retry identical atomic command -> [RECOVERED: internal_retry]"
    permission: "[Error: permission] 401/403 Unauthorized/AccessDenied -> report missing Action/requestID; ask once and end the turn; retry only after the user explicitly confirms authorization, otherwise [BLOCKED: PERMISSION_REQUIRED]"
  infrastructure_failure: "if the CLI fails below the API layer, retry the identical atomic command once, then report the raw output; never fabricate the expected response"
  idempotent_skip: "[Idempotent-Skip] <create/apply-command> skipped; verified via <get/list-command> that state matches expectation."

project:
  create_project:
    status: confirmed
    required: [--project-name, --description]
    optional: [--data-redundancy-type, --recycle-bin-enabled, --resource-group-id]
  get_project:
    status: confirmed
    required: [--project]        # verify param name via `aliyun sls get-project --help`
  list_project:
    status: confirmed
    optional: [--project-name, --size, --offset]
    note: "subcommand is singular: list-project"
  update_project:
    status: confirmed
    pre: "get-project first, carry description/attributes back"
  delete_project:
    status: confirmed
    risk: R4

logstore:
  create_log_store:
    status: confirmed
    required: [--project, --logstore-name, --shard-count, --ttl]
    optional: [--auto-split, --max-split-shard, --append-meta, --enable-tracking, --hot-ttl,
               --infrequent-access-ttl, --telemetry-type, --enable-modify, --encrypt-conf, --resource-group-id]
  get_log_store:
    status: confirmed
    required: [--project, --logstore]
  list_log_stores:
    status: confirmed
    note: "subcommand is plural: list-log-stores"
  update_log_store:
    status: confirmed
    required: [--project, --logstore, --logstore-name, --ttl]
    pre: "get-log-store first; preserve ttl/shardCount/type/append-meta"
    note: "CLI quirk (aliyun-cli-sls 0.7.0): update-log-store requires BOTH --logstore and --logstore-name with the same value (create uses only --logstore-name; get/delete use only --logstore). Preserve full params; omitting fields may reset to default."
  delete_log_store:
    status: confirmed
    risk: R4

index:
  create_index:
    status: confirmed
    required: [--project, --logstore]
    optional: [--keys, --line, --max-text-len, --scan-index, --log-reduce]
    note: "--keys is field-index JSON; --line is full-text index object and uses chn=true (includeChinese is invalid). Call get-index first; use create only on IndexConfigNotExist, otherwise update-index."
  get_index:
    status: confirmed
    required: [--project, --logstore]
  update_index:
    status: confirmed
    pre: "get-index first; full overwrite — merge new keys with existing"
  delete_index:
    status: confirmed
    risk: R3

machine_group:
  create_machine_group:
    status: confirmed
    required: [--project, --group-name, --machine-identify-type, --machine-list]
    optional: [--group-attribute, --group-type]
    note: "--machine-identify-type: ip | userdefined ; --machine-list takes SPACE-SEPARATED values (e.g. --machine-list 192.168.0.1 10.0.0.2), NOT a JSON array — a JSON string gets double-encoded and the collector never matches"
  get_machine_group:
    status: confirmed
    required: [--project, --machine-group]      # verify exact param via --help
  list_machine_group:
    status: confirmed
    note: "subcommand is singular: list-machine-group"
  update_machine_group:
    status: confirmed
    pre: "get-machine-group first; overwrite semantics (see incremental_member note)"
  delete_machine_group:
    status: confirmed
    risk: R4
  list_machines:
    status: confirmed          # CLI-001 CLOSED
    required: [--project, --machine-group]
    optional: [--offset, --size]     # size default 100, max 500
    returns: "machines[] with identity, lastHeartbeatTime, and binary (collector version, e.g. 3.3.4)"
  member_update:
    status: confirmed          # CLI-003
    method: "get-machine-group -> merge machine-list -> update-machine-group (full-object overwrite). Re-read before write to guard concurrency."
    note: "This full-object update is the standard method; update-machine-group-machine is intentionally not used (incomplete)."

pipeline_config:
  mandatory_mapping:
    rule: "Use only get/list/create/update/delete-logtail-pipeline-config with --config-name (list uses --project and optional --logstore-name). Never use classic get/list/update-config as Pipeline aliases or use --config. If the object has inputDetail/outputDetail instead of inputs/processors/flushers, stop as classic-config unsupported."
  create_logtail_pipeline_config:
    status: confirmed
    required: [--project, --config-name, --inputs, --flushers]
    optional: [--processors, --aggregators, --global, --log-sample]
    note: "inputs: exactly 1; flushers: exactly 1 flusher_sls; native and extended plugins cannot be mixed"
  get_logtail_pipeline_config:
    status: confirmed
    required: [--project, --config-name]
  list_logtail_pipeline_config:
    status: confirmed
    note: "subcommand is singular: list-logtail-pipeline-config"
  update_logtail_pipeline_config:
    status: confirmed
    pre: "get-logtail-pipeline-config first; carry full inputs/processors/flushers/global back"
  delete_logtail_pipeline_config:
    status: confirmed
    risk: R4

binding:
  mandatory_mapping:
    rule: "group->configs is get-applied-configs --machine-group; config->groups is get-applied-machine-groups --config-name. Never invent get-machine-group-applied-configs or get-config-applied-machine-groups."
  apply_config_to_machine_group:
    status: confirmed
    required: [--project, --machine-group, --config-name]
    post: "read binding back via get-applied-configs / get-applied-machine-groups"
  remove_config_from_machine_group:
    status: confirmed
    required: [--project, --machine-group, --config-name]
    risk: R3
  get_applied_configs:
    status: confirmed
    note: "configs applied to a machine group (machine-group snapshot)"
  get_applied_machine_groups:
    status: confirmed          # CLI-002 CLOSED
    required: [--project, --config-name]

query:
  get_logs_v2:
    status: confirmed
    required: [--project, --logstore, --from, --to]   # --from/--to are UNIX seconds (int)
    optional: [--query, --line, --offset, --reverse, --power-sql, --forward, --highlight]
    note: "use for business logstore AND SLS Lens run logs; check meta.progress for completeness; never use deprecated get-logs"
  get_logging:
    status: confirmed          # CLI-004
    required: [--project]
    returns: "loggingProject (Lens/service-log project) + loggingDetails[] {type, logstore}"
    note: "type logtail_status|logtail_profile|logtail_alarm -> Lens run-log logstore (typically internal-diagnostic_log); type operation_log -> operation-record logstore (internal-operation_log)"

version_discovery:
  status: confirmed          # CLI-007
  chain:
    - "config or machine group known: list-machines --project <p> --machine-group <g> -> machines[].binary is the collector version (a config maps to its bound group via get-applied-machine-groups)"
    - "only an IP known: SLS Lens logtail_status.version (get-logs-v2 on the Lens logstore)"
    - "user-provided version"
  rule: "If version still cannot be confirmed, do NOT generate configs that depend on version gates; ask the user."

lens_entry_discovery:
  status: confirmed          # CLI-004
  method: "get-logging --project <business-project> -> loggingProject is the Lens project; the loggingDetails[] entry whose type is logtail_status/logtail_profile/logtail_alarm gives the Lens logstore (typically internal-diagnostic_log)."
  fallback: "if get-logging is unavailable/denied/LoggingNotExist and Lens evidence is required, ask once and wait for user-provided lens_project/logstore; verify it, then query via get-logs-v2. Never STAROps/console-private/UID-guessed entries."

# --- install.deploy adapters (non-SLS) ------------------------------------
# Cloud-API commands still carry --region and the skill --user-agent.
# Do not use OOS / ChatOps. Addon name is loongcollector (not loongcollector-ds).

host_install:
  script: loongcollector.sh
  official_doc: "https://help.aliyun.com/zh/sls/loongcollector-installation-linux"
  render: "scripts/render_loongcollector_install_cmd.py"
  actions:
    install_same_account_same_region: "./loongcollector.sh install ${region}"
    install_cross_region_internet: "./loongcollector.sh install ${region}-internet"
    install_cross_region_acceleration: "./loongcollector.sh install ${region}-acceleration"
    upgrade: "./loongcollector.sh upgrade"   # never reuse install to overwrite
  identity:
    user_defined_id: "/etc/ilogtail/user_defined_id"
    users_file: "/etc/ilogtail/users/${aliuid}"   # cross-account
  accept: "sudo /etc/init.d/loongcollectord status  ->  loongcollector is running"
  windows: blocked

ecs_runcommand:
  status: confirmed_contract
  exec:
    command: "aliyun ecs run-command --region-id <region> --type RunShellScript --timeout 600 --command-content '<remote_command>' --instance-id.1 <ecs_instance_id>"
    poll: "aliyun ecs describe-invocation-results --region-id <region> --invoke-id <invoke_id> --content-encoding PlainText"
    note: "Poll until InvocationStatus is Success/Failed/PartialFailed. Read Output then loongcollectord status. Never workbench/OOS. Never print AK/SK. Never StrictHostKeyChecking=no."
  scope: "Alibaba Cloud Linux ECS only; does not create ECS. Cloud Assistant must be running (default on Alibaba Cloud Linux)."

ssh_host:
  status: confirmed_contract
  rule: "User-configured SSH alias/agent only; confirm host fingerprint; never accept a private key in chat; never StrictHostKeyChecking=no; no unbounded root shell."
  shape: "ssh <alias> -- <literal-command>  then check exit code and loongcollectord status."

ack_enablement:
  status: confirmed
  note: "Eval hooks also open ACK / create sls-eval-loop-ack as a fixture. Skill must still do this on a real first-use account. Do not invent the eval cluster name in production."
  script: "scripts/ensure_ack_prereq.sh --region <r>"
  when: "ErrorNotEnabled / cskpro / NotEnabled / EntityNotExist.Role on any aliyun cs write; or preflight ack_service=warn"
  open_service:
    cli: "aliyun cs open-ack-service --type propayasgo"
    risk: R2
    idempotent: true
    detail: "enables ACK Pro + Basic pay-as-you-go; already-enabled is a no-op"
  service_roles:
    cli: "aliyun ram get-role / aliyun ram create-role / aliyun ram attach-policy-to-role"
    trust: "cs.aliyuncs.com"
    names:
      - AliyunCSDefaultRole
      - AliyunCSManagedKubernetesRole
      - AliyunCSManagedNetworkRole
      - AliyunCSManagedLogRole
      - AliyunCSManagedCmsRole
      - AliyunCSManagedCsiRole
      - AliyunCSManagedAutoScalerRole
    fail: "DefaultRole still missing -> RAM HITL, not PREFLIGHT_FAILED"
  create_cluster:
    only_when: "user explicitly asked to create a cluster"
    never: ["--profile", "auto-create sls-eval-loop-ack", "create ECS / invent VPC"]
    cli: "aliyun cs create-cluster --name <n> --cluster-type ManagedKubernetes --biz-profile Default --cluster-spec ack.standard --vpcid <vpc> --vswitch-ids <vsw>"
    spec_order: [ack.standard, ack.pro.small]
    recover: "ErrorNotEnabled -> open-ack-service then retry this spec once; EntityNotExist.Role -> ensure_ack_prereq.sh then retry once"
    risk: R2

ack_addon:
  status: confirmed            # verified aliyun 3.4.6 + aliyun-cli-cs
  plugin: "aliyun-cli-cs"
  addon_name: "loongcollector"  # NOT loongcollector-ds (that is the in-cluster DaemonSet)
  mutex: "logtail / logtail-ds already installed -> do not auto-uninstall (R4); stop and report."
  commands:
    describe_addon:
      cli: "aliyun cs describe-addon --addon-name loongcollector [--cluster-id <cid>]"
      required: [--addon-name]
    list_instances:
      cli: "aliyun cs list-cluster-addon-instances --cluster-id <cid>"
      required: [--cluster-id]
    describe_instance:
      cli: "aliyun cs describe-cluster-addon-instance --cluster-id <cid> --addon-name loongcollector"
      required: [--cluster-id, --addon-name]
    get_instance:
      cli: "aliyun cs get-cluster-addon-instance --cluster-id <cid> --instance-name loongcollector"
      required: [--cluster-id, --instance-name]
    list_resources:
      cli: "aliyun cs list-cluster-addon-instance-resources --cluster-id <cid> --instance-name loongcollector"
    install:
      cli: "aliyun cs install-cluster-addons --cluster-id <cid> --biz-body name=loongcollector"
      required: [--cluster-id, --biz-body]
      note: "Current aliyun-cli-cs uses --biz-body name=... (not --body). Optional version= after describe-addon."
      risk: R2
    upgrade:
      cli: "aliyun cs upgrade-cluster-addons --cluster-id <cid> --biz-body component_name=loongcollector"
      required: [--cluster-id, --biz-body]
      risk: R2
  wait: "scripts/wait_cs_task.sh --cluster-id <cid> --addon-name loongcollector"
  reuse_after_install:
    project: "k8s-log-${cluster_id}"
    machine_group: "k8s-group-${cluster_id}"
  collection_default: "aliyun sls create-logtail-pipeline-config + apply-config-to-machine-group k8s-group-${cluster_id}"
  kubeconfig_optional_crd:
    status: confirmed            # verified 2026-08-28: public endpoint empty → intranet 6443 only
    detail: "describe-cluster-detail master_url.api_server_endpoint must be non-empty before issuing public kubeconfig"
    issue: "aliyun cs describe-cluster-user-kubeconfig --cluster-id <cid> --private-ip-address false --temporary-duration-minutes 15"
    secret_rule: "Write config to 0600 tempfile; never print/cat kubeconfig or client certs; do not overwrite ~/.kube/config"
    fail_closed: "empty public endpoint or TCP 6443 unreachable → stay on SLS API; do not enable EIP unless user asks"
    not_agent_channel: "CloudShell / console Workbench are browser terminals, not OpenAPI exec"

self_k8s_install:
  official_doc: "https://help.aliyun.com/zh/sls/loongcollector-installation-kubernetes-1"
  method: "User kubectl + official custom package; discover package version at runtime; never hardcode a doc example (e.g. 3.2.6) as latest."
  values_required: [projectName, region, aliUid, net, clusterID, accessKeyID, accessKeySecret]
  secret_rule: "Do not ask for or print AK/SK in chat; read from an already-configured local/cluster secret path the user names, or stop."
  accept: "kubectl get po -n kube-system | grep loongcollector-ds  ->  Running"
  reuse_after_install:
    project: "values.yaml projectName"
    machine_group: "k8s-group-${clusterID}"

crd_pipeline:
  kind: ClusterAliyunPipelineConfig
  api_version: telemetry.alibabacloud.com/v1alpha1
  scope: cluster
  name_rule: "metadata.name == SLS config name; 2-128 lowercase [a-z0-9_-]"
  default: "do not use; K8s collection uses SLS Pipeline API"
  prefer_when:
    - user explicitly asked for ClusterAliyunPipelineConfig / GitOps / kubectl apply CR
    - environment is ack or self_k8s
    - kube-apiserver reachable (public endpoint or in-VPC)
    - kubectl auth can-i create clusteraliyunpipelineconfigs returns yes
    - CRD registered
    - alibaba-log-controller or loongcollector-operator is running
  commands:
    get_crd: "kubectl get crd clusteraliyunpipelineconfigs.telemetry.alibabacloud.com"
    can_i: "kubectl auth can-i create clusteraliyunpipelineconfigs"
    list: "kubectl get clusteraliyunpipelineconfigs -o yaml"
    get: "kubectl get clusteraliyunpipelineconfigs <name> -o yaml"
    dry_run: "kubectl apply --dry-run=server -f <cr.yaml>"
    apply: "kubectl apply -f <cr.yaml>"
    delete: "kubectl delete clusteraliyunpipelineconfigs <name>"
  status_pass: "status.success==true and lastAppliedConfig non-empty"
  forbidden_kinds: [AliyunLogConfig, NamespaceAliyunPipelineConfig]
  render: "scripts/render_crd.py"
  validate: "scripts/validate_pipeline.py on spec.config, then kubectl apply --dry-run=server after approval"

