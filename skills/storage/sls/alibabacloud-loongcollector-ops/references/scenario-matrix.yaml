# Scenario matrix
#
# Source: loongcollector-oncall/knowledge/base/collection-config/recipes.md (scenario/param matrix).
# Infer `scenario` from the user's description; if evidence is insufficient, ASK — do not default.
# machine_identify_type (ip|userdefined) only after the user confirms.
# Matrices drive config.create / onboarding.cloud / install.deploy collection.
# K8s collection defaults to SLS Pipeline API. ClusterAliyunPipelineConfig is opt-in (crd-pipeline.md).

scenarios:
  host:
    signals: "ECS/host/server/Windows/Linux; host file path; no container/k8s semantics"
    required: [region, project, logstore, config_name, log_path, machine_group_name, machine_identify_type, machine_identifiers]
    recommended: [parse_mode, sample_log, multiline, index_fields, logstore_params]
    input_hint: input_file
    extra_checks: "Linux/Win not mixed in a group; user identity file; agent version & heartbeat"

  host_agentsight:
    signals: "Agentloop; AgentSight; input_agentsight; eBPF Runtime; ai-runtime-ebpf; ebpf-event; runtime-ebpf-agentsight-config"
    required: [region, project, machine_group_name]
    recommended: [machine_identify_type, machine_identifiers, cmdline_whitelist, cmdline_blacklist, domains, desensitize]
    input_hint: input_agentsight
    aliases: [agentloop]
    fixed:
      config_name: runtime-ebpf-agentsight-config
      logstore: ebpf-event
      product_log: agentloop.ebpf_event
      protocol_id: loongcollector-runtime
    extra_checks: "Linux host only; kernel >=5.10; collector >=3.3.9 (SLS help); existing config is lock-and-skip (no overwrite); not OBI/OTLP; ProductLog Enable is out of channel — require get-log-store ebpf-event"

  docker_stdio:
    signals: "docker stdout/stderr; no k8s semantics"
    required: [region, project, logstore, config_name, machine_group_name, machine_identify_type, machine_identifiers, container_filters]
    recommended: [sample_log, parse_mode, index_fields]
    input_hint: input_container_stdio
    extra_checks: "json-file log driver; container lifecycle/rotation; version unknown → ask COLLECTOR_VERSION"

  docker_file:
    signals: "container file logs / mounted path"
    required: [region, project, logstore, config_name, log_path, machine_group_name, machine_identify_type, machine_identifiers, container_filters]
    recommended: [sample_log, parse_mode, index_fields]
    input_hint: input_file

  k8s_stdio:
    signals: "k8s/ack/namespace/pod/container; collect stdout"
    required: [region, project, logstore, config_name, cluster_id, container_filters]
    recommended: [deployment_mode, sample_log, index_fields]
    input_hint: input_container_stdio
    extra_checks: "DaemonSet/Sidecar; aliUid/region/net; node drift for low-replica pods"

  k8s_file:
    signals: "k8s + container file path / mounted volume"
    required: [region, project, logstore, config_name, cluster_id, log_path, container_filters]
    recommended: [deployment_mode, sample_log, index_fields]
    input_hint: input_file

  k8s_crd:
    note: "management path (ClusterAliyunPipelineConfig), not a 4th deployment form"
    writable: true
    prefer_when: "user explicitly asked for ClusterAliyunPipelineConfig/GitOps AND kube-apiserver is reachable AND can-i create AND controller is running"
    required: [region, project, logstore, config_name, cluster_id, container_filters]
    recommended: [log_path, sample_log, index_fields]
    input_hint: input_container_stdio
    signals: "AliyunPipelineConfig/CRD/GitOps/IaC; kubectl apply; ACK/self-built cluster with cluster permissions"
    extra_checks: "metadata.name == config name; bind official k8s-group-${cluster_id}; never double-write API; do not create AliyunLogConfig"

cross_account_region:
  note: "cross-account/region needs explicit network type and user identity confirmation; ask before proceeding"
