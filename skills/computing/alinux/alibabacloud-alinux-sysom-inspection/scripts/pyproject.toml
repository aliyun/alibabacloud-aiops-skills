[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sysom-inspection"
version = "0.1.0"
description = "SysOM inspection CLI"
requires-python = ">=3.8"
dependencies = [
    "requests>=2.31.0",
    "alibabacloud-tea-openapi>=0.4.4,<1.0.0",
    "alibabacloud-tea-util>=0.3.14,<1.0.0",
]

[project.scripts]
sysom-inspection = "sysom_cli.__main__:main"
